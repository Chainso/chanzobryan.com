---
layout: default
---

<article class="paper-page">
  <div class="container">
    <nav class="paper-nav" aria-label="Paper navigation">
      <a href="{{ '/#papers' | relative_url }}">← Papers</a>
    </nav>

    <header class="paper-hero">
      <div class="paper-kicker">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %Y" }}</time>
      </div>
      <h1>{{ page.title }}</h1>
      <p class="paper-deck">{{ page.deck }}</p>
      <a href="{{ page.pdf_url | relative_url }}" class="btn btn-primary" target="_blank" rel="noopener">Read PDF</a>
    </header>

    <figure class="paper-figure">
      <a href="{{ page.image | relative_url }}" class="paper-figure-link" target="_blank" rel="noopener" aria-label="Open the full-size figure">
        <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">
      </a>
    </figure>

    <div class="paper-abstract">
      {{ content }}
    </div>
  </div>
</article>
